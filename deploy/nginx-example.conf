# WhoProbe Nginx Reverse Proxy Example
# Supports both root deployment (https://probe.example.com/)
# and isolated subpath deployment (https://example.com/who/) on an existing TLS 443 vhost.

# ----------------------------------------------------------------------
# Option A: Mount under an existing HTTPS server block at /who/
# ----------------------------------------------------------------------
# Paste these two location blocks inside your existing `server { listen 443 ssl http2; ... }`:

location = /who {
    return 301 /who/;
}

location = /who/api/who/ws-ping {
    proxy_pass http://127.0.0.1:18899;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 10s;
}

location ^~ /who/ {
    proxy_pass http://127.0.0.1:18899;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Overwrite identity and connection data at the trusted ingress, never forward
    # copies supplied by visitors. With realip rewriting, use $realip_remote_addr
    # and $realip_remote_port for the actual TCP peer (not the reported client IP).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Edge-Peer-IP $remote_addr;
    proxy_set_header X-Edge-Peer-Port $remote_port;
    proxy_set_header X-Edge-Local-IP $server_addr;
    proxy_set_header X-Edge-Local-Port $server_port;

    # Pass negotiated HTTP & TLS metadata from Nginx edge to WhoProbe
    proxy_set_header X-HTTP-Version $server_protocol;
    proxy_set_header X-TLS-Protocol $ssl_protocol;
    proxy_set_header X-TLS-Cipher $ssl_cipher;
    proxy_set_header X-TLS-Curves $ssl_curves;
    proxy_set_header X-TLS-ALPN $ssl_alpn_protocol;
    proxy_set_header X-TLS-Reused $ssl_session_reused;

    proxy_buffering off;
    proxy_read_timeout 15s;
}

