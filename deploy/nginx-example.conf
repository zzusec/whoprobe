# ----------------------------------------------------------------------
# Option C (Advanced): Capture Raw HTTP/2 Akamai Frames via TLS Bridge
# ----------------------------------------------------------------------
# Run probe.py with `--tls-bridge-port 18449 --tls-cert ... --tls-key ...`
# and route port 443 via Nginx `stream` with automatic fallback to 10443:
#
# upstream who_tls_front {
#     server 127.0.0.1:18449 max_fails=2 fail_timeout=3s;
#     server 127.0.0.1:10443 backup;
# }
#
# Inside `http {}`, add local cleartext h2c (10082) & h1 (10081) listeners
# forwarding to `http://127.0.0.1:18899` with `real_ip_header proxy_protocol;`.
# On these loopback-only listeners set the four X-Edge-* header values (in order:
# peer address/port, local address/port) from $proxy_protocol_addr,
# $proxy_protocol_port, $proxy_protocol_server_addr, $proxy_protocol_server_port.
# Set X-Real-IP from $proxy_protocol_addr, X-Forwarded-Proto to https and
# X-HTTP-Version from $server_protocol; clear X-TLS-* so the app uses the TLS bridge.
#
# HTTP/3 (optional dedicated endpoint): use an HTTP/3-capable TLS terminator on
# the UDP port, advertise HTTP/3, and pass the negotiated HTTP version above.
# Do not put WhoProbe's passive Initial collector on the same UDP port.
# For visibility DNS, use a dedicated wildcard HTTPS vhost/certificate and
# route /api/who/visibility/sample to this service without redirects. Authorize
# the main site's exact origin with --visibility-origin on the sample backend.
